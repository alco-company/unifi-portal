# Minimal working FreeRADIUS configuration
# Compatible with FreeRADIUS 3.0.27 and simple module setup

# Basic server configuration
prefix = /etc/freeradius
exec_prefix = ${prefix}
sysconfdir = ${prefix}
localstatedir = /var
sbindir = ${exec_prefix}/sbin
logdir = /var/log/radius
raddbdir = ${sysconfdir}/freeradius
radacctdir = ${logdir}/radacct

# Process and security (no user/group to avoid SIGTRAP)
name = freeradius
confdir = ${raddbdir}
run_dir = /var/run/freeradius
db_dir = /var/lib/freeradius
libdir = /usr/lib/freeradius
pidfile = ${run_dir}/${name}.pid
max_request_time = 30
cleanup_delay = 5
max_requests = 16384

# Logging
log {
    destination = stdout
    colourise = yes
    file = ${logdir}/radius.log
    syslog_facility = daemon
    stripped_names = no
    auth = yes
    auth_badpass = yes 
    auth_goodpass = yes
    msg_denied = "You are already logged in - access denied"
}

# Security
security {
    allow_core_dumps = no
    max_attributes = 200
    reject_delay = 1
    status_server = yes
}

# Define modules section
modules {
    # Load individual module files
    $INCLUDE ${confdir}/mods-enabled/pap
    $INCLUDE ${confdir}/mods-enabled/chap
    $INCLUDE ${confdir}/mods-enabled/mschap
    $INCLUDE ${confdir}/mods-enabled/files
    $INCLUDE ${confdir}/mods-enabled/detail
    $INCLUDE ${confdir}/mods-enabled/radutmp
    $INCLUDE ${confdir}/mods-enabled/always
    $INCLUDE ${confdir}/mods-enabled/attr_filter
}

# Instantiate only what we have
instantiate {
    pap
    chap
    mschap
    files
    detail
    radutmp
}

# Simple virtual server for testing
server default {
    listen {
        type = auth
        ipaddr = *
        port = 1812
        limit {
            max_connections = 16
            lifetime = 0
            idle_timeout = 30
        }
    }

    listen {
        type = acct
        ipaddr = *
        port = 1813
        limit {
            max_connections = 16
            lifetime = 0
            idle_timeout = 30
        }
    }

    authorize {
        # File-based authorization for testing
        files
        
        # Set Auth-Type for users without explicit type
        if (!control:Auth-Type) {
            update control {
                Auth-Type := PAP
            }
        }
        
        pap
    }

    authenticate {
        Auth-Type PAP {
            pap
        }
        
        Auth-Type CHAP {
            chap
        }
        
        Auth-Type MS-CHAP {
            mschap
        }
    }

    preacct {
        files
    }

    accounting {
        detail
        radutmp
    }

    session {
        radutmp
    }

    post-auth {
        # Log successful authentications
        if (ok || updated) {
            noop
        }

        Post-Auth-Type REJECT {
            # Log failed attempts  
            noop
        }
    }
}
